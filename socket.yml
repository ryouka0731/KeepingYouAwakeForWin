# Socket Security configuration. Free for public OSS repositories.
# Docs: https://docs.socket.dev/docs/socket-yml
#
# Scans the NuGet test dependencies and the Python tool manifests for
# supply-chain risk (malware, typosquats, install scripts, obfuscated code,
# telemetry, native code, privilege escalation).

version: 2

projectIgnorePaths:
  - "**/bin/**"
  - "**/obj/**"

issueRules:
  malware: true
  gptMalware: true
  gptSecurity: true
  installScripts: true
  telemetry: true
  obfuscatedFile: true
  didYouMean: true
  unmaintained: true
  shellScriptOverride: true
  troll: true
