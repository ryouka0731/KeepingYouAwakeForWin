name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege by default; jobs that need more declare it themselves.
permissions:
  contents: read

# Cancel older runs against the same ref to keep the queue short.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  python-tests:
    name: Python tools (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install test deps
        # Hash-pinned lock (see the .in file for how to regenerate it).
        run: python -m pip install --require-hashes -r .github/requirements/requirements-python-tests.txt

      - name: Run pytest (kya CLI + MCP server)
        run: pytest -v

  build-and-test:
    name: Build + unit tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore KeepingYouAwake.slnx

      - name: Build (Release)
        run: dotnet build KeepingYouAwake.slnx --configuration Release --no-restore

      - name: Unit tests
        run: >-
          dotnet test tests/KeepingYouAwake.Core.Tests --configuration Release --no-build
          --logger "trx;LogFileName=results.trx" --collect:"XPlat Code Coverage"
          --results-directory TestResults

      - name: Smoke test (publish + launch + URL commands)
        # Publishes the self-contained exe, starts it, drives it with the same
        # command-line arguments the URL scheme uses, and checks that it is
        # still running and that the activity log recorded the session.
        shell: pwsh
        run: |
          dotnet publish src/KeepingYouAwake -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o publish
          $exe = Resolve-Path publish/KeepingYouAwake.exe
          $app = Start-Process $exe -PassThru
          Start-Sleep -Seconds 5
          if ($app.HasExited) { throw "app exited early with code $($app.ExitCode)" }
          Start-Process $exe -ArgumentList '--activate','60' -Wait
          Start-Sleep -Seconds 3
          $log = Join-Path $env:APPDATA 'KeepingYouAwake\activity.jsonl'
          if (-not (Test-Path $log)) { throw "activity log not written" }
          $last = Get-Content $log | Select-Object -Last 1 | ConvertFrom-Json
          if ($last.requestedDuration -ne 60 -or $last.endedAt) { throw "unexpected log entry: $($last | ConvertTo-Json -Compress)" }
          $requests = powercfg /requests | Out-String
          Write-Host $requests
          Start-Process $exe -ArgumentList '--deactivate' -Wait
          Start-Sleep -Seconds 3
          $last = Get-Content $log | Select-Object -Last 1 | ConvertFrom-Json
          if ($last.endedReason -ne 'user-cancelled') { throw "session not ended: $($last | ConvertTo-Json -Compress)" }
          Stop-Process -Id $app.Id -Force
          # powercfg may leave a non-zero exit code when not elevated; the assertions above passed.
          exit 0

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore
