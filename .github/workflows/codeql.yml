name: CodeQL

# GitHub-native SAST. Free for public repositories. Results show up under
# Security → Code scanning and as PR annotations.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly catch-all so the database stays current between PRs.
    - cron: '17 7 * * 1'

# Least privilege by default; the analyze job adds what it needs.
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
      security-events: write   # upload results
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: manual
          - language: python
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: matrix.language == 'csharp'
        with:
          global-json-file: global.json

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality

      - name: Build
        if: matrix.build-mode == 'manual'
        run: dotnet build KeepingYouAwake.slnx --configuration Release

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"
