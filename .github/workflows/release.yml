name: Release

on:
  # Tag-driven release: pushing `v*` builds the app for x64 and ARM64 and
  # uploads zipped single-file executables to the matching GitHub Release.
  push:
    tags:
      - 'v*'
  # Manual trigger to backfill assets onto an existing release.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v1.0.0). Falls back to GITHUB_REF when empty."
        required: false
        type: string

# Least privilege by default; the release job adds what it needs.
permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  build-and-upload:
    name: Build and attach to release
    runs-on: windows-latest
    permissions:
      contents: write   # needed for `gh release create/upload`
    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        # Never interpolate the workflow_dispatch input into the script: pass
        # it through env and whitelist its shape with an anchored regex.
        env:
          TAG_INPUT: ${{ github.event.inputs.tag }}
        run: |
          TAG="$TAG_INPUT"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "::error::tag does not match allowed pattern: ${TAG}"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Unit tests
        run: dotnet test tests/KeepingYouAwake.Core.Tests --configuration Release

      - name: Publish
        shell: pwsh
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          foreach ($rid in 'win-x64', 'win-arm64') {
            dotnet publish src/KeepingYouAwake -c Release -r $rid --self-contained `
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
              -p:Version=$env:VERSION -o "publish/$rid"
            Copy-Item LICENSE "publish/$rid/LICENSE.txt"
            $zip = "dist/KeepingYouAwake-$env:VERSION-$rid.zip"
            Compress-Archive -Path "publish/$rid/KeepingYouAwake.exe", "publish/$rid/LICENSE.txt" -DestinationPath $zip
            (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() + "  " + (Split-Path $zip -Leaf) | Out-File "$zip.sha256" -Encoding ascii
          }
          Get-ChildItem dist

      - name: Create or update the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
        run: |
          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            FLAGS=(--generate-notes --title "${TAG}")
            if [ "${PRERELEASE}" = "true" ]; then FLAGS+=(--prerelease); fi
            gh release create "${TAG}" "${FLAGS[@]}"
          fi
          gh release upload "${TAG}" dist/* --clobber
