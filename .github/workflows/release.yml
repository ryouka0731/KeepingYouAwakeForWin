name: Release

on:
  # Tag-driven release: pushing `v*` builds the app for x64 and ARM64 and
  # uploads zipped single-file executables to the matching GitHub Release.
  push:
    tags:
      - 'v*'
  # Manual trigger to backfill assets onto an existing release.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v1.0.0). Falls back to GITHUB_REF when empty."
        required: false
        type: string

# Least privilege by default; the release job adds what it needs.
permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  build-and-upload:
    name: Build and attach to release
    runs-on: windows-latest
    permissions:
      contents: write   # needed for `gh release create/upload`
      actions: read     # SignPath reads this run's job details and artifact
    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        # Never interpolate the workflow_dispatch input into the script: pass
        # it through env and whitelist its shape with an anchored regex.
        env:
          TAG_INPUT: ${{ github.event.inputs.tag }}
        run: |
          TAG="$TAG_INPUT"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "::error::tag does not match allowed pattern: ${TAG}"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Unit tests
        run: dotnet test tests/KeepingYouAwake.Core.Tests --configuration Release

      - name: Publish
        shell: pwsh
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          foreach ($rid in 'win-x64', 'win-arm64') {
            dotnet publish src/KeepingYouAwake -c Release -r $rid --self-contained `
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
              -p:Version=$env:VERSION -p:IncludeSourceRevisionInInformationalVersion=false `
              -o "unsigned/$rid"
          }
          Get-ChildItem -Recurse unsigned -Filter *.exe

      # Code signing through SignPath Foundation (free for open source). Runs only
      # once the SIGNPATH_API_TOKEN secret is configured; until then releases are
      # unsigned. SignPath verifies the artifact came from this workflow run, and
      # every request waits for manual approval in SignPath. Configuration:
      # .signpath/README.md.
      - name: Check for SignPath configuration
        id: signpath
        shell: bash
        # Only the true/false result of the secret comparison reaches the script.
        # Signing also requires the run to be on the tag itself (tag push, or
        # "Run workflow" with the tag selected), so a branch's workflow file can
        # never get a binary signed.
        env:
          HAS_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
          ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if [ "${HAS_TOKEN}" != "true" ]; then
            echo "SignPath not configured: publishing unsigned executables."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${REF_TYPE}" != "tag" ] || [ "${REF_NAME}" != "${TAG}" ]; then
            echo "::error::Signed releases must run on the tag ref (got ${REF_TYPE} '${REF_NAME}', tag '${TAG}'). Use 'Run workflow' with the tag selected under 'Use workflow from'."
            exit 1
          fi
          if [ -z "${ORGANIZATION_ID}" ]; then
            echo "::error::SIGNPATH_API_TOKEN is set but the SIGNPATH_ORGANIZATION_ID variable is not. See .signpath/README.md."
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Upload unsigned executables
        id: upload-unsigned
        if: steps.signpath.outputs.enabled == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned
          # Only the executables (no .pdb); the zip keeps win-x64/ and win-arm64/.
          path: unsigned/*/KeepingYouAwake.exe
          if-no-files-found: error
          # "Re-run failed jobs" after a SignPath timeout reuploads it.
          overwrite: true

      - name: Sign with SignPath
        if: steps.signpath.outputs.enabled == 'true'
        uses: SignPath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'KeepingYouAwakeForWin' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG || 'initial' }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          parameters: |
            version: ${{ toJSON(steps.tag.outputs.version) }}
          # Leaves time for an approver to approve the request in SignPath.
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: signed

      - name: Package
        shell: pwsh
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          SIGNED: ${{ steps.signpath.outputs.enabled }}
        run: |
          $source = if ($env:SIGNED -eq 'true') { 'signed' } else { 'unsigned' }
          if (-not (Test-Path $source)) { throw "expected $source executables, found none" }
          Write-Host "Packaging $source executables"
          New-Item -ItemType Directory -Force dist | Out-Null
          foreach ($rid in 'win-x64', 'win-arm64') {
            $exe = "$source/$rid/KeepingYouAwake.exe"
            if (-not (Test-Path $exe)) { throw "missing $exe" }
            if ($source -eq 'signed') {
              $signature = Get-AuthenticodeSignature $exe
              if ($signature.Status -ne 'Valid') { throw "$exe signature is $($signature.Status)" }
              Write-Host "$rid signed by $($signature.SignerCertificate.Subject)"
            }
            New-Item -ItemType Directory -Force "package/$rid" | Out-Null
            Copy-Item $exe "package/$rid/KeepingYouAwake.exe"
            Copy-Item LICENSE "package/$rid/LICENSE.txt"
            $zip = "dist/KeepingYouAwake-$env:VERSION-$rid.zip"
            Compress-Archive -Path "package/$rid/*" -DestinationPath $zip
            (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() + "  " + (Split-Path $zip -Leaf) | Out-File "$zip.sha256" -Encoding ascii
          }
          Get-ChildItem dist

      - name: Create or update the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
        run: |
          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            FLAGS=(--generate-notes --title "${TAG}")
            if [ "${PRERELEASE}" = "true" ]; then FLAGS+=(--prerelease); fi
            gh release create "${TAG}" "${FLAGS[@]}"
          fi
          gh release upload "${TAG}" dist/* --clobber
