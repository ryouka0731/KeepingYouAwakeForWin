# Keeps the commit-SHA–pinned GitHub Actions, the NuGet test packages and the
# hash-pinned CI Python locks current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /.github/requirements
    schedule:
      interval: weekly
    groups:
      ci-python:
        patterns: ["*"]
